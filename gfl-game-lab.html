<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GFL Game Lab</title><style>*{box-sizing:border-box}body{background:#102b30;color:#f7f2e7;font:16px system-ui;margin:0}main{max-width:760px;margin:auto;padding:20px}h1{font-size:30px}small{color:#b7c9c7}section{background:#193b40;border:1px solid #36565a;border-radius:14px;padding:16px;margin:16px 0}label{display:block;margin:12px 0 4px}select,button,input{font:inherit;padding:12px;border-radius:8px;border:0;width:100%}button{background:#e99b54;color:#17282a;font-weight:bold;margin-top:12px;cursor:pointer}.scores{display:grid;grid-template-columns:1fr 1fr;text-align:center;gap:10px}.score{font-size:44px;font-weight:bold}#feed{max-height:420px;overflow:auto}article{padding:10px 0;border-bottom:1px solid #36565a}a{color:#ffbd7d}</style><main><small>GRANITE FOOTBALL LEAGUE / DEVELOPMENT BUILD 0.1</small><h1>Game Lab</h1><p>Experimental team-level simulation. All franchises begin with equal ratings.</p><section><label for="home">Home franchise</label><select id="home"></select><label for="away">Away franchise</label><select id="away"></select><label for="seed">Game seed (repeatable results)</label><input id="seed" type="number" value="1"><button id="run">Simulate game</button><button id="watch">Watch accelerated replay</button></section><section id="result" hidden><div id="status"></div><div class="scores" id="scores"></div><div id="stats"></div><button id="finish">Reveal final</button><h2>Play-by-play</h2><div id="feed"></div></section><small>Prototype: no season saves, player rosters, real-time scheduling, full penalties or complete special-teams rules yet.</small></main><script>(function(root){
function simulate(home,away,seed=1){let s=seed>>>0;const rnd=()=>((s=(Math.imul(s,1664525)+1013904223)>>>0)/4294967296);const teams=[home,away],score=[0,0],log=[];let q=1,clock=900,side=0,pos=20,down=1,need=10,elapsed=0;const stats=teams.map(()=>({plays:0,yards:0,turnovers:0,td:0,fg:0}));const emit=(text)=>log.push({q,clock,elapsed,score:[...score],side,pos,down,need,text});const name=()=>teams[side].name;const rate=(i,k)=>teams[i][k]??75;const change=(p)=>{side=1-side;pos=Math.max(1,Math.min(109,p));down=1;need=Math.min(10,110-pos)};const add=(n,t)=>{score[side]+=n;emit(t)};function conversion(opts){let n=opts[Math.floor(rnd()*opts.length)];let p={1:.80,2:.50,3:.32,4:.22}[n];if(rnd()<p){add(n,`${name()} converts for ${n}`)}else{emit(`${name()} fails ${n}-point try`)}return n}function kickoff(){if(rnd()<.004){add(4,`${name()} scores a four-point kickoff!`);change(20)}else if(rnd()<.10){emit('Kickoff violation: receiving team starts at own 40');change(40)}else{change(15+Math.floor(rnd()*24));emit(`${name()} receives kickoff`)}}function play(ot=false){const st=stats[side],a=rate(side,'offense'),d=rate(1-side,'defense');let dist=137-pos; if(down===4){if(dist<=67 && (need>2||pos>85)){let p=Math.max(.03,Math.min(.98,.98-(dist-25)*.012+(rate(side,'kicking')-75)*.008));if(rnd()<p){st.fg++;add(dist>60?4:3,`${name()} makes ${dist}-yard field goal`);return 'score'}emit(`${name()} misses ${dist}-yard field goal`);return 'miss'}if(!ot&&need>2){let landing=pos+35+Math.floor(rnd()*23);if(landing>=110){if(rnd()<.55){add(1,`${name()} scores a punt rouge`);change(20)}else{emit('Punt through end zone');change(20)}}else{emit(`${name()} punts`);change(110-landing+Math.floor(rnd()*12))}return 'change'}}st.plays++;let pass=rnd()<.58;let roll=rnd(),gain=0; if(roll<.022){st.turnovers++;emit(`${name()} ${pass?'interception':'fumble lost'}`);return 'turnover'}if(pass&&roll<.34){emit(`${name()} incomplete pass`)}else{gain=Math.round((rnd()+rnd()-0.65)*(pass?16:9)+(a-d)*.13);if(rnd()<.055)gain+=15+Math.floor(rnd()*35);gain=Math.min(110-pos,gain);st.yards+=gain;pos+=gain;emit(`${name()} ${pass?'pass':'run'} for ${gain} yards`)}if(pos<=0){score[1-side]+=2;emit('Safety');return 'safety'}if(pos>=110){st.td++;add(6,`${name()} touchdown`);conversion(ot?(q===5?[1,2,3,4]:[2,3,4]):[1,1,1,1,2,3,4]);return 'score'}if(gain>=need){down=1;need=Math.min(10,110-pos)}else{down++;need-=gain}if(down>4){emit('Turnover on downs');return 'turnover'}return 'continue'}emit('Opening kickoff');side=1;kickoff();for(q=1;q<=4;q++){clock=900;if(q===3){side=0;kickoff()}while(clock>0){let result=play();if(result==='score')kickoff();else if(result==='safety')change(35);else if(result==='turnover'||result==='miss')change(110-pos);let duration=log[log.length-1].text.includes('incomplete')?7:20+Math.floor(rnd()*23);clock=Math.max(0,clock-duration);elapsed+=duration*2.6+12;}emit(`End of quarter ${q}`)}for(let round=1;score[0]===score[1]&&round<=100;round++){q=4+round;clock=0;for(let j=0;j<2;j++){side=(round+j)%2;pos=85;down=1;need=10;emit(`Overtime ${round}: ${name()}`);if(round>=3)conversion([2,3,4]);else for(let k=0;k<40;k++){let r=play(true);if(r!=='continue')break}elapsed+=100} }if(score[0]===score[1])throw Error('Overtime limit reached');emit('Final');return {teams,score,stats,log,duration:elapsed,seed}}
if(typeof module!=='undefined')module.exports={simulate};else root.GFL={simulate};})(globalThis);
</script><script>const teams=["Anaheim Golems", "Honolulu Corkadiles", "Oakland Originals", "Sacramento Guardians", "Santa Ana Causes", "Stockton Swampdogs", "Ventura Barracudas", "Devil Lake Devils", "Edmonton Knights", "North Dakota Albatrosses", "Portland Vikings", "Saskatchewan Dunes", "South Dakota Bison", "Yukon Yetis", "Albuquerque Becauses", "Albuquerque Boltz", "Dallas Panthers", "Denver Eagles", "Los Angeles Texas Grassholes", "Salt Lake City Pythons", "San Antonio 89ers", "Utah Bandits", "Grand Rapids Shoebills", "Kansas City Guards", "Lake Petersburg Ducks", "Michigan Rhinos", "Nashville Nightdrakes", "Tri-City Triceratops", "Brooklyn Burgers", "Buffalo Musketeers", "Delaware Tigers", "Ocean City Walruses", "Philadelphia Pirates", "Wei\u00dfwasser Wizards"];const $=id=>document.getElementById(id);for(const id of ['home','away'])for(const t of teams)$(id).add(new Option(t,t));$('home').value='Albuquerque Becauses';$('away').value='Los Angeles Texas Grassholes';let g,timer;function render(n){const e=g.log[n];$('result').hidden=false;$('status').textContent=n===g.log.length-1?'FINAL':(e.q<=4?'Q'+e.q:'OT '+(e.q-4))+' · '+Math.floor(e.clock/60)+':'+String(e.clock%60).padStart(2,'0');$('scores').replaceChildren(...g.teams.map((t,i)=>{let d=document.createElement('div');d.textContent=t.name;let v=document.createElement('div');v.className='score';v.textContent=e.score[i];d.append(v);return d}));$('feed').replaceChildren(...g.log.slice(0,n+1).reverse().map(x=>{let a=document.createElement('article');a.textContent=(x.q<=4?'Q'+x.q:'OT'+(x.q-4))+' · '+Math.floor(x.clock/60)+':'+String(x.clock%60).padStart(2,'0')+' — '+x.text;a.append();return a}));$('stats').textContent=n===g.log.length-1?g.stats.map((s,i)=>g.teams[i].name+': '+s.yards+' yards, '+s.turnovers+' giveaways').join(' | '):''}function start(watch){clearInterval(timer);if($('home').value===$('away').value){alert('Choose two different teams');return}g=GFL.simulate({name:$('home').value},{name:$('away').value},Number($('seed').value));let i=0;render(watch?0:g.log.length-1);if(watch)timer=setInterval(()=>{render(++i);if(i>=g.log.length-1)clearInterval(timer)},180)}$('run').onclick=()=>start(false);$('watch').onclick=()=>start(true);$('finish').onclick=()=>{clearInterval(timer);if(g)render(g.log.length-1)};</script></html>
